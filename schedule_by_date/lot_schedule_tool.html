<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日別ロット予定</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--alt:#e8f0f8;--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#2f5d8a;--accent-bg:#e8eff6;--zero:#a33;--zero-bg:#fbeeee;--wknd:#f1efe8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#21211f;--ink:#ecebe6;--muted:#9b9a93;--line:#3a3935;--accent:#8fb6dd;--accent-bg:#24303b;--zero:#e08a8a;--zero-bg:#3a2424;--wknd:#2a2926;--alt:#232c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
#drop{border:2px dashed var(--line);border-radius:10px;background:var(--card);padding:28px;text-align:center;cursor:pointer;transition:.15s}
#drop.over{border-color:var(--accent);background:var(--accent-bg)}
#drop b{color:var(--accent)}
#fileinfo{color:var(--muted);margin-top:8px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=date],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.cats label{display:flex;gap:5px;align-items:center;font-size:13px}
.cats .n{color:var(--muted);font-size:11px}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0 8px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-size:18px;display:block}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden;break-inside:avoid}
.day h2{font-size:15px;margin:0;padding:8px 14px;background:var(--accent-bg);display:flex;justify-content:space-between}
.day.we h2{background:var(--wknd)}
.day h2 span{color:var(--muted);font-weight:normal;font-size:13px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 14px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:normal}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cat{color:var(--muted);font-size:12px;white-space:nowrap}
td.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
tr.zero td{color:var(--zero);background:var(--zero-bg)}
tr.zero td.name{text-decoration:line-through}
.note{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:10px 14px;font-size:13px}
.err{color:var(--zero);margin-top:10px}
.alert{border:1px solid var(--zero);background:var(--zero-bg);border-radius:10px;padding:10px 14px;margin-top:16px}
.alert summary{cursor:pointer;font-weight:bold;color:var(--zero)}
.alert table{margin-top:8px;font-size:13px}
.alert td,.alert th{padding:4px 8px}
.alert .bad{color:var(--zero);font-weight:bold}
.alert .sug{color:var(--accent);font-weight:bold}
.places{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.places label{display:flex;gap:5px;align-items:center;font-size:13px}
.places .n{color:var(--muted);font-size:11px}
.places label.unk{color:var(--zero)}
.flt{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.flt .h{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.flt .h a{color:var(--accent);cursor:pointer}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{padding:4px 10px;font-size:13px;background:transparent;color:var(--accent)}
.presets button.on{background:var(--accent);color:#fff}
td.place{font-size:12px;color:var(--muted)}
td.place .bad{color:var(--zero)}
.tabs{display:flex;gap:6px;margin-top:16px}
.tabs button{background:transparent;color:var(--muted);border-color:var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mx{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:10px}
.mx table{font-size:12px}
.mx td,.mx th{padding:4px 6px;white-space:nowrap;border:1px solid var(--line);text-align:center}
.mx td.name,.mx th.name{text-align:left;position:sticky;left:0;background:var(--card)}
.mx td.alt,.mx th.alt{background:var(--alt)}
.mx td.z{color:var(--zero);background:var(--zero-bg)}
.mx th.we{background:var(--wknd)}
@media (max-width:600px){td.cat,th.cat,td.code,th.code{display:none}}
/* One-page print calendar (A4 landscape). Laid out off-screen so it can be measured, shown only when printing */
@page{size:A4 landscape;margin:7mm}
#printview{-webkit-print-color-adjust:exact;print-color-adjust:exact;position:absolute;left:-10000px;top:0;visibility:hidden;width:283mm;color:#000;background:#fff}
#printview h1{font-size:15px;margin:0 0 3px;display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
#printview h1 span{font-weight:normal;font-size:11px;white-space:normal;text-align:right}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:11px;border:1px solid #000;padding:1px;text-align:center;color:#000;background:#eee}
.cal td{border:1px solid #000;padding:1px 3px;vertical-align:top;font-size:var(--fs,10.5px);line-height:1.2}
.cal td.out{background:#f3f3f3}
.cal .dn{font-weight:bold;font-size:1.15em}
.cal .it{border-top:1px dotted #999;overflow:hidden}
.cal .it .q{float:right;white-space:nowrap;font-weight:bold;margin-left:4px}
.cal .it .q small{font-weight:normal}
.cal .it.z{color:#777;text-decoration:line-through}
.cal .nt{font-size:.85em;color:#444}
.cal .it .nt{display:block;clear:both}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.files .fl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.files .fn{font-weight:bold;word-break:break-all}
.files .n{color:var(--muted);font-size:12px}
.files button.x{padding:2px 9px;line-height:1.4}
.cal.inst td{height:9mm;vertical-align:middle;font-size:12px}
.mxpage{break-before:page;page:mxpage}
.mxpage:first-child{break-before:auto}
/* 品目×日付 prints on B4 portrait (JIS B4 257×364mm, the B4 used in Japan; CSS "B4" is the smaller ISO size) */
@page mxpage{size:257mm 364mm;margin:7mm}
#printview:has(.mxpage){width:243mm}
.gp{width:100%;border-collapse:collapse;table-layout:fixed}
.gp thead{display:table-header-group}
.gp tr{break-inside:avoid}
/* 品目×日付 print: same pt sizes and font as the Excel export (see MX_FONT) */
.mxpage{font-family:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif}
.mxpage h1{font-size:16pt!important}.mxpage h1 span{font-size:9pt!important}
.mxpage .foot{font-size:9pt;margin:3px 0 0}
.gp th,.gp td{border:1px solid #000;padding:1px 3px;color:#000}
.gp th{font-size:10pt;background:#eee;text-align:center;font-weight:bold}
.gp th.we{background:#d9d9d9}
.gp th.sun{color:#b00}.gp th.sat{color:#03a}
.gp td{height:11mm;font-size:13pt;text-align:center;vertical-align:middle}
.gp td.nm{text-align:left;font-size:12pt;line-height:1.2;font-weight:bold}
.gp td.u{font-size:9pt}
.gp td.we{background:#f3f3f3}
.gp td.alt,.gp th.alt{background:#e3edf8}
.gp td.alt.we{background:#d3dfec}
.gp th.alt.we{background:#c8d6e6}
.gp td b{font-size:13pt}
.gp td.z b{text-decoration:line-through;color:#777}
.gp td .nt{display:block;font-size:7pt;color:#444;line-height:1.1}
.mx.em td{white-space:normal}
.mx.em td.cell{min-width:0!important;width:auto}
.em td.slot{font-weight:bold;white-space:normal;min-width:90px}
.em .cell{font-size:12px;line-height:1.3}
.em .cell .tag{font-size:10px;color:var(--muted)}
.em .cell .over{color:var(--zero);font-weight:bold}
.em .cell.free{background:var(--accent-bg)}
.em .cell .zz{color:var(--muted);text-decoration:line-through;font-size:11px}
.em .stat.ng{color:var(--zero);font-weight:bold}
.gp td.em{height:24mm;font-size:12px;text-align:left;vertical-align:top;line-height:1.25}
.gp td.em b{font-size:13px}
.gp td.em .tag{font-size:9px;color:#555}
.gp td.em .over{color:#b00;font-weight:bold}
.gp td.em .zz{text-decoration:line-through;color:#777;font-size:10px}
.gp td.st{height:7mm;font-size:10px;text-align:center}
.gp td.st.ng{color:#b00;font-weight:bold}
.empage{page:empage;width:196mm}
@page empage{size:A4 portrait;margin:7mm}
#printview:has(.empage){width:196mm}
.ev{width:100%;border-collapse:collapse;table-layout:fixed}
.ev th,.ev td{border:1px solid #000;padding:2px 4px;color:#000;vertical-align:top}
.ev th{background:#eee;font-size:11px;text-align:center}
.ev td{font-size:var(--fs,12px);line-height:1.3}
.ev td.dt{text-align:center;vertical-align:middle;font-weight:bold;font-size:calc(var(--fs,12px) * 1.15)}
.ev td.dt.sun{color:#b00}.ev td.dt.sat{color:#03a}
.ev tr.we td{background:#f3f3f3}
.ev td b{font-size:calc(var(--fs,12px) * 1.1)}
.ev .tag{font-size:.8em;color:#555}
.ev .over{color:#b00;font-weight:bold}
.ev .zz{text-decoration:line-through;color:#777;font-size:.85em}
.ev td.st{text-align:center;vertical-align:middle;font-size:.85em}
.ev td.st.ng{color:#b00;font-weight:bold}
/* 日付×枠 sheet: Excel-style colour headers; on screen it is a white "paper" preview */
/* Sized for older readers: 早朝 sheet text starts at 20px and only shrinks if a page overflows */
.evx th{color:#fff;font-size:var(--fs,15px);line-height:1.15;padding:3px 1px;border-color:#000}
.evx th:nth-child(-n+2){background:#555}
.evx tr.alt td{background:#e8f0f8}
.evx td.dt{padding:2px 1px;font-size:var(--fs,16px);white-space:nowrap}
.evx th:nth-child(-n+2){white-space:nowrap}
.evx .tag{font-size:.85em;color:#333}
.evx .zz{font-size:.9em}
.empage h1{font-size:20px!important}.empage h1 span{font-size:12px!important}
.evfoot{font-size:11px;margin:3px 0 0}
/* Changes since the previous version: a black tag so it survives black-and-white printing, plus a pale cell */
.chg{display:inline-block;background:#000;color:#fff;font-weight:bold;font-size:.85em;padding:0 3px;border-radius:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.evx td.hl{background:#fff3b0!important}
.cx s{color:#555}
.chgt{border-collapse:collapse;margin-top:8px;font-size:14px}
.chgt th,.chgt td{border:1px solid var(--line,#ccc);padding:3px 8px;text-align:left}
.rules{background:var(--card);border:1px solid var(--line,#ccc);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px}
.rules summary{font-weight:bold;cursor:pointer}
.rules table{border-collapse:collapse;margin:8px 0}
.rules th,.rules td{border:1px solid var(--line,#ccc);padding:5px 8px;text-align:left;vertical-align:top}
.rules ul{margin:4px 0 0;padding-left:20px}
.rules table.zk td,.rules table.zk th{text-align:center;min-width:70px;vertical-align:middle}
.rules table.zk tr:first-child th{background:var(--alt)}
.chgl td{font-size:var(--fs,16px);vertical-align:middle;padding:6px 4px}
.evx tr.ng td{background:#fbe3e3}
.evwrap{background:#fff;color:#000;border:1px solid var(--line,#ccc);border-radius:8px;padding:8px;overflow-x:auto}
.evwrap .evx{min-width:960px}
.evwrap .evx td{height:40px;font-size:16px}
.seg{display:inline-flex}
.seg button{border-radius:0;background:transparent;color:inherit;border:1px solid currentColor;opacity:.6}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{opacity:1;font-weight:bold}
.calpage{break-before:page}
.calpage:first-child{break-before:auto}
#printview>div:first-child>.calpage:first-child{break-before:auto}
#printview>div+div>.calpage:first-child{break-before:page}
/* 6-day calendar sheet (日別 / 作業場所別 print), A4 横 */
.d5{width:100%;border-collapse:collapse;table-layout:fixed}
.d5 th{border:1px solid #000;background:#eee;color:#000;font-size:14pt;padding:2px;text-align:center}
.d5 th.we{background:#d9d9d9}.d5 th.sun{color:#b00}.d5 th.sat{color:#03a}
.d5 td{border:1px solid #000;vertical-align:top;padding:0;font-size:var(--fs,12pt);line-height:1.25;color:#000}
.d5 td.we{background:#f6f6f6}
.d5 .col{display:flex;flex-direction:column;font-size:var(--fs,12pt)}
.d5 .it{padding:2px 4px;border-bottom:1px dotted #999}
.d5 .it .ln{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:4px}
.d5 .it .q{white-space:nowrap;font-weight:bold;margin-left:auto}
.d5 .it .q small{font-weight:normal;font-size:.8em}
.d5 .it .nm{font-weight:bold}
.d5 .it.z{color:#777;text-decoration:line-through}
.d5 .it .oth{font-size:.75em;color:#555}
.d5 .it .nt{font-size:.8em;color:#333}
.d5 .wa{flex:1;min-height:var(--wa,30mm);border-top:1.5px solid #000;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(9mm - 1px),#aaa calc(9mm - 1px),#aaa 9mm)}
.d5 .wa span{display:block;font-size:8pt;color:#666;padding:1px 4px;background:inherit}
.d5page .foot{font-size:9pt;margin:3px 0 0}
.cal .it .oth{font-size:.8em;color:#555}
.cal.inst td:nth-child(4),.cal.inst td:nth-child(6){text-align:right}
.cal th.sun,.cal td.sun .dn{color:#b00}.cal th.sat,.cal td.sat .dn{color:#03a}
@media print{
  body{background:#fff}
  main{max-width:none;padding:0}
  main>*:not(#printview){display:none!important}
  #printview{position:static;visibility:visible}
}
cal th.sat,.cal td.sat .dn{color:#03a}
}
</style>
<style id="emPageStyle"></style>
</head>
<body>
<main>
<h1>日別ロット予定</h1>
<p class="sub">在庫表のExcelをドロップすると、「計画」の行から日別の製造予定を出します。複数のファイルを入れると1つにまとめて表示します。ファイルはこのブラウザ内だけで処理されます。</p>

<div id="drop">Excelファイルをここにドロップ（<b>複数可</b>・あとから追加もできます）、または <b>クリックして選択</b>
  <input id="file" type="file" accept=".xlsx,.xlsm,.xls" multiple hidden>
  <div id="fileinfo"></div>
</div>
<div id="err" class="err"></div>

<div id="controls" class="panel" hidden>
  <div class="files" id="files"></div>
  <div class="row">
    <label class="f">開始日<input type="date" id="from"></label>
    <label class="f">終了日<input type="date" id="to"></label>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="showZero" checked>0（中止・変更）も表示</label>
  </div>
  <div class="cats" id="cats"></div>
  <div class="flt" id="placeFilter" hidden>
    <label class="f"><span><span id="placeLabel">作業場所</span>で検索（含む）</span>
      <input type="search" id="placeQ" list="placeOpts" placeholder="例：肉処理　／　複数は「、」区切り（どれかを含む）" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:min(420px,100%)">
    </label>
    <datalist id="placeOpts"></datalist>
    <div class="presets" id="placePresets"></div>
  </div>
  <div class="row noprint" style="margin-top:14px">
    <button class="ghost" id="allc">分類すべて</button>
    <button class="ghost" id="defc">冷凍のみ</button>
  </div>
</div>

<div id="statusAlert"></div>
<div id="placeAlert"></div>
<div id="out"></div>
<div id="printview"></div>
</main>

<script>
const DEFAULT_CATS = ['冷凍品', '冷凍(箱)', '販売用餃子/通販'];
const WD = ['日', '月', '火', '水', '木', '金', '土'];

// Official 作業場所 names (formerly 製造場所). A sheet named 作業場所リスト / 部署リスト / 製造場所リスト in the
// dropped workbook (names in column A) overrides this built-in list.
const DEFAULT_PLACES = ['昼間根菜カット', '昼間野菜仕込み', '早朝野菜処理', '昼間サラダ室', '早朝サラダ室', '昼間肉処理室', '早朝肉処理室',
  '昼間魚処理室', '早朝魚処理室', '昼間厨房①', '早朝厨房', '昼間厨房②', '昼間パッケージ室', '早朝パッケージ室', '昼間仕分室', '早朝仕分室',
  '第2工場', '米飯課', '米飯課　早朝厨房', '米飯課　昼間厨房', '米飯課　早朝パッケージ室', '米飯課　昼間パッケージ室', '早朝米飯厨房'];
const PLACE_LIST_SHEETS = ['作業場所リスト', '部署リスト', '製造場所リスト'];
// One-click groups of 作業場所 for the search box (any of them, combined into one 品目×日付 etc.)
const PLACE_PRESETS = [
  { label: '昼間4か所（サラダ室・野菜仕込み・根菜カット・厨房①）', places: ['昼間サラダ室', '昼間野菜仕込み', '昼間根菜カット', '昼間厨房①'] },
];
// Shorthand seen in existing files → official name. Used ONLY for suggestions; matching itself is exact.
const PLACE_ALIASES = {
  '早朝肉': '早朝肉処理室', '早肉処理': '早朝肉処理室', '昼肉処理': '昼間肉処理室', '早朝魚': '早朝魚処理室', '昼魚処理': '昼間魚処理室',
  '早朝サラダ': '早朝サラダ室', '昼サラダ': '昼間サラダ室', '早朝パッケ': '早朝パッケージ室', '昼パッケ': '昼間パッケージ室',
  '昼間厨房': '昼間厨房①', '昼厨房': '昼間厨房①', '昼間厨房二番': '昼間厨房②', '第二工場': '第2工場', '第二': '第2工場',
  '米飯課昼': '米飯課　昼間厨房', '米飯昼厨房': '米飯課　昼間厨房', '米飯早朝': '米飯課　早朝厨房', '米飯課早朝': '米飯課　早朝厨房',
  '昼カット': '昼間根菜カット', '昼間カット': '昼間根菜カット', '根菜カット': '昼間根菜カット',
  '早朝野菜': '早朝野菜処理', '早朝野菜仕込み': '早朝野菜処理', '早朝野菜仕込み①': '早朝野菜処理', '早朝野菜仕込み②': '早朝野菜処理',
  '早朝野菜仕込み③': '早朝野菜処理', '早朝根菜カット': '早朝野菜処理', '早朝カット': '早朝野菜処理', '早朝野菜、早朝サラダ': '早朝野菜処理', '昼野菜': '昼間野菜仕込み', '昼間仕込み': '昼間野菜仕込み',
  '仕分': '昼間仕分室', '仕分室': '昼間仕分室', '早朝仕分': '早朝仕分室'
};
let PLACES = DEFAULT_PLACES;
const PLACE_SEP = /[、,，・\/／\n]+/; // several places in one cell

// Loose key for suggestions only: full/half width, spaces, ①→1
const looseKey = s => String(s).normalize('NFKC').replace(/[\s　]/g, '');
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function suggestPlace(text) {
  const k = looseKey(text);
  const same = PLACES.find(p => looseKey(p) === k);
  if (same) return same;
  const alias = Object.entries(PLACE_ALIASES).find(([a]) => looseKey(a) === k);
  if (alias && PLACES.includes(alias[1])) return alias[1];
  let best = null, bestD = Infinity;
  for (const p of PLACES) { const d = editDistance(k, looseKey(p)); if (d < bestD) { bestD = d; best = p; } }
  return bestD <= Math.max(1, Math.floor(k.length / 3)) ? best : '';
}
// Strict: each part must equal an official name exactly
function checkPlaces(raw) {
  const text = String(raw ?? '').trim();
  if (!text) return { ok: [], bad: [{ text: '（空欄）', sug: '' }] };
  const ok = [], bad = [];
  for (const part of text.split(PLACE_SEP).map(x => x.trim()).filter(Boolean)) {
    if (PLACES.includes(part)) ok.push(part); else bad.push({ text: part, sug: suggestPlace(part) });
  }
  return { ok, bad };
}
function loadPlaceList(workbook) {
  const name = workbook.SheetNames.find(n => PLACE_LIST_SHEETS.includes(n.trim()));
  if (!name) return DEFAULT_PLACES;
  const vals = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: null })
    .map(r => r && r[0] != null ? String(r[0]).trim() : '').filter(v => v && !/^(部署|作業場所|製造場所)/.test(v));
  return vals.length ? vals : DEFAULT_PLACES;
}
const $ = id => document.getElementById(id);
let parsed = null, view = 'day';
// Tabs, in order. TABS_OFF hides a tab without removing its code; delete an entry to bring the tab back.
const TABS = [['day', '日別'], ['mx', '品目×日付'], ['inst', '肉専用指示書発行'], ['dept', '作業場所別'], ['em', '早朝肉処理指示']];
const TABS_OFF = ['inst', 'dept']; // turned off for now (2026-11-11)

// Normalise full-width parens/spaces so "冷凍（箱）" and "冷凍(箱)" match
const norm = s => String(s ?? '').replace(/（/g, '(').replace(/）/g, ')').replace(/\s+/g, '').trim();
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.y}-${pad(d.m)}-${pad(d.d)}`;

function toYMD(v) {
  if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
  if (typeof v === 'number' && v > 30000 && v < 80000) {
    const p = XLSX.SSF.parse_date_code(v);
    return { y: p.y, m: p.m, d: p.d };
  }
  return null;
}
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(String(v).replace(/[,，\s]/g, ''));
  return Number.isFinite(n) ? n : null;
}

// Find the header row (contains 行種別) and map columns by name
function parseSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) if ((rows[i] || []).some(c => norm(c) === '行種別')) { h = i; break; }
  if (h < 0) return null;
  const hdr = rows[h];
  const col = name => hdr.findIndex(c => norm(c).startsWith(name));
  const C = { cat: col('分類'), code: col('コード'), name: col('品目名'), lot: col('ロット(一回'), type: col('行種別') };
  C.unit = col('ロット単位') >= 0 ? col('ロット単位') : col('計画単位');
  C.cs = col('CS/コンテナ');
  C.place = col('作業場所') >= 0 ? col('作業場所') : col('製造場所'); // older files still say 製造場所
  const placeLabel = C.place >= 0 ? norm(hdr[C.place]) : '作業場所';
  C.slot = col('肉処理製造枠');
  C.status = col('状態'); // 使用中 / 未使用 / 保存中 (A列)
  const firstRow = XLSX.utils.decode_range(ws['!ref'] || 'A1').s.r + 1; // Excel row number of rows[0]
  const dates = [];
  hdr.forEach((v, i) => { if (i > C.type) { const d = toYMD(v); if (d) dates.push({ i, ...d, key: iso(d) }); } });
  if (!dates.length) return null;

  // Row labels vary between files (備考 / 備考/販促, 計画（倍）/ 計画（本）/ 計画（p）…),
  // so match by prefix and take the unit from the label's brackets.
  const unitOf = t => (t.match(/\(([^)]+)\)/) || [])[1] || '';
  const blocks = [];
  let cur = null;
  for (let r = h + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const t = norm(row[C.type]);
    if (t.startsWith('備考')) { // first row of each product block
      cur = { cat: String(row[C.cat] ?? '').trim(), code: row[C.code] ?? '', name: String(row[C.name] ?? '').trim(), lot: num(row[C.lot]), cs: C.cs >= 0 ? num(row[C.cs]) : null, unit: String(row[C.unit] ?? ''), notes: row, plan: null, planUnit: '', qty: null, excelRow: firstRow + r,
        status: C.status >= 0 ? norm(row[C.status]) : '', placeRaw: C.place >= 0 ? String(row[C.place] ?? '').trim() : '', slot: C.slot >= 0 ? norm(row[C.slot]) : '' };
      cur.place = C.place >= 0 ? checkPlaces(cur.placeRaw) : { ok: [], bad: [] };
      blocks.push(cur);
    } else if (cur && t.startsWith('計画') && !cur.plan) { cur.plan = row; cur.planUnit = unitOf(t); }
    else if (cur && t.startsWith('入庫予定数') && !cur.qty) { cur.qty = row; if (unitOf(t)) cur.unit = unitOf(t); }
  }

  const items = [];
  blocks.forEach((b, order) => {
    if (!b.plan || !b.name) return;
    for (const d of dates) {
      const p = num(b.plan[d.i]);
      if (p === null) continue;
      // 計画 × ロット is the quantity produced that day (入庫予定数 itself is shifted by lead time)
      let q = b.lot !== null ? Math.floor(p * b.lot + 1e-9) : (b.qty ? num(b.qty[d.i]) : null);
      if (b.lot === null && q === 0 && p > 0) q = null; // no lot size entered → quantity unknown, not 0
      // 計画 c/s = 計画 × ロット × CS/コンテナ, unrounded to 2 decimals like the Google sheet (e.g. 1200枚 → 9.23 c/s)
      const cs = b.lot !== null && b.cs > 0 ? Math.round(p * b.lot * b.cs * 100) / 100 : null;
      const note = b.notes[d.i];
      items.push({ date: d.key, y: d.y, m: d.m, d: d.d, cat: b.cat, code: b.code, name: b.name, plan: p, planUnit: b.planUnit, order, qty: q, cs, unit: b.unit, note: note == null ? '' : String(note), status: b.status, row: b.excelRow, places: b.place.ok, placeBad: b.place.bad.length > 0, placeRaw: b.placeRaw, slot: b.slot });
    }
  });
  // Every named product block is checked, planned or not, so the planner can fix them all
  const placeIssues = C.place < 0 ? [] : blocks.filter(b => b.name && b.place.bad.length)
    .map(b => ({ row: b.excelRow, code: b.code, name: b.name, raw: b.placeRaw, bad: b.place.bad }));
  // Every product row (planned or not), so 使用中 products can be listed even without a plan. Template rows are skipped.
  const products = blocks.map((b, order) => ({ order, cat: b.cat, code: b.code, name: b.name, planUnit: b.planUnit, status: b.status, row: b.excelRow,
    places: b.place.ok, placeBad: b.place.bad.length > 0, placeRaw: b.placeRaw, slot: b.slot })).filter(b => b.name && !b.name.startsWith('テンプレート'));
  return { items, dates, products, hasPlace: C.place >= 0, placeLabel, placeIssues, hasSlot: C.slot >= 0 };
}

// Several workbooks (e.g. 守屋 + 杉田, or last month + this month) are shown as one schedule.
// Dropping more files adds to the list; a file with the same name replaces the earlier copy.
let files = []; // [{ name, wb, sheets, sheet }]
function loadFiles(list) {
  const fs = [...list].filter(f => /\.xls[xm]?$/i.test(f.name));
  if (!fs.length) return;
  $('err').textContent = '';
  $('fileinfo').textContent = '読み込み中… ' + fs.map(f => f.name).join('、');
  const errs = [];
  Promise.all(fs.map(f => f.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, { type: 'array', cellDates: false });
    PLACES = loadPlaceList(wb);
    const sheets = wb.SheetNames.filter(n => parseSheet(wb.Sheets[n]));
    if (!sheets.length) throw new Error('「行種別」列と日付ヘッダーのあるシートが見つかりません。');
    return { name: f.name, wb, sheets, sheet: sheets[sheets.length - 1] };
  }).catch(ex => { errs.push(`${f.name}：${ex.message}`); return null; }))).then(loaded => {
    for (const x of loaded.filter(Boolean)) {
      const i = files.findIndex(o => o.name === x.name);
      if (i >= 0) files[i] = x; else files.push(x);
    }
    $('err').textContent = errs.length ? 'エラー: ' + errs.join(' ／ ') : '';
    combine();
  });
}

function combine() {
  if (!files.length) {
    parsed = null;
    ['out', 'placeAlert', 'statusAlert', 'printview', 'files'].forEach(id => $(id).innerHTML = '');
    $('fileinfo').textContent = '';
    $('controls').hidden = true;
    return;
  }
  // The first workbook with its own 作業場所リスト sheet sets the list (checkPlaces runs inside parseSheet)
  PLACES = files.map(f => loadPlaceList(f.wb)).find(p => p !== DEFAULT_PLACES) || DEFAULT_PLACES;
  const parts = files.map(f => ({ file: f.name, ...parseSheet(f.wb.Sheets[f.sheet]) }));
  parsed = mergeParsed(parts);
  $('fileinfo').textContent = files.map(f => f.name).join(' ＋ ');
  $('files').innerHTML = files.map((f, i) => `<div class="fl"><span class="fn">${esc(f.name)}</span>
    <select data-i="${i}">${f.sheets.map(n => `<option ${n === f.sheet ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <span class="n">${md(parts[i].dates[0].key)}〜${md(parts[i].dates[parts[i].dates.length - 1].key)}</span>
    <button class="ghost x" data-i="${i}" title="このファイルを外す">×</button></div>`).join('');
  $('files').querySelectorAll('select').forEach(s => s.onchange = () => { files[s.dataset.i].sheet = s.value; combine(); });
  $('files').querySelectorAll('button.x').forEach(b => b.onclick = () => { files.splice(Number(b.dataset.i), 1); combine(); });
  $('controls').hidden = false;
  resetFilters();
}

// One parsed sheet per file → one combined schedule
function mergeParsed(parts) {
  // コード and 品目名 together: many rows still carry the template's placeholder コード「code」
  const keyOf = it => `${it.code}|${it.name}`;
  // A product found in an earlier file keeps that file's row order, so it stays one row in 品目×日付
  const orderOf = new Map();
  parts.forEach((p, fi) => {
    const local = new Map(); // row order in this sheet → order in the combined view
    const orderFor = x => {
      if (!local.has(x.order)) {
        const k = keyOf(x), known = orderOf.get(k);
        local.set(x.order, known && known.fi !== fi ? known.order : fi * 1e6 + x.order);
        if (!known) orderOf.set(k, { fi, order: local.get(x.order) });
      }
      return local.get(x.order);
    };
    for (const x of [...p.products, ...p.items]) Object.assign(x, { order: orderFor(x), file: p.file, hasSlot: p.hasSlot });
  });
  // Same product on the same date in several files (e.g. last month's overflow columns and this month's sheet):
  // the sheet that starts later wins, and differing plans are listed so the planner can check them
  const rank = parts.map((_, i) => i).sort((a, b) => parts[a].dates[0].key.localeCompare(parts[b].dates[0].key) || a - b);
  const cells = new Map(), conflicts = [];
  const planText = list => list.map(x => fmt(x.plan) + x.planUnit).join('・');
  for (const fi of rank) for (const it of parts[fi].items) {
    const ck = `${it.date}|${keyOf(it)}`, c = cells.get(ck);
    if (!c) cells.set(ck, { fi, items: [it] });
    else if (c.fi === fi) c.items.push(it);
    else {
      if (planText(c.items) !== planText([it])) conflicts.push({ date: it.date, code: it.code, name: it.name, oldFile: parts[c.fi].file, oldPlan: planText(c.items), file: parts[fi].file, plan: planText([it]) });
      cells.set(ck, { fi, items: [it] });
    }
  }
  // One entry per product; the sheet that starts later has the current 状態
  const products = [...new Map(rank.flatMap(fi => parts[fi].products).map(b => [b.order, b])).values()];
  const dates = [...new Map(parts.flatMap(p => p.dates).map(d => [d.key, d])).values()].sort((a, b) => a.key.localeCompare(b.key));
  const withPlace = parts.find(p => p.hasPlace);
  return {
    items: [...cells.values()].flatMap(c => c.items), products, dates, conflicts, multi: parts.length > 1,
    hasPlace: !!withPlace, placeLabel: withPlace ? withPlace.placeLabel : '作業場所', hasSlot: parts.some(p => p.hasSlot),
    placeIssues: parts.flatMap(p => p.placeIssues.map(i => ({ ...i, file: p.file }))),
  };
}

function resetFilters() {
  const counts = {};
  parsed.items.forEach(it => counts[it.cat] = (counts[it.cat] || 0) + 1);
  // 分類 of 使用中 products with no plan get a checkbox too (count 0), so their rows can show in 品目×日付
  parsed.products.forEach(b => { if (b.status === '使用中') counts[b.cat] = counts[b.cat] || 0; });
  const cats = Object.keys(counts).filter(Boolean).sort();
  const isDef = c => DEFAULT_CATS.some(dc => norm(dc) === norm(c));
  const anyDef = cats.some(isDef); // files without the frozen categories (e.g. 肉処理) start with everything ticked
  $('cats').innerHTML = cats.map(c => `<label><input type="checkbox" value="${c}" ${!anyDef || isDef(c) ? 'checked' : ''}>${c}<span class="n">${counts[c]}</span></label>`).join('');
  // Default range: current month, clamped to the sheet's dates
  const first = parsed.dates[0].key, last = parsed.dates[parsed.dates.length - 1].key;
  const now = new Date();
  let f = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`;
  let t = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate())}`;
  if (f < first || f > last) { f = first; t = parsed.dates[Math.min(30, parsed.dates.length - 1)].key; }
  $('from').min = $('to').min = first; $('from').max = $('to').max = last;
  $('from').value = f; $('to').value = t;
  buildPlaceFilter();
  renderPlaceAlert();
  render();
}

function buildPlaceFilter() {
  $('placeFilter').hidden = !parsed.hasPlace;
  if (!parsed.hasPlace) return;
  $('placeLabel').textContent = parsed.placeLabel;
  // Autocomplete: official names that appear in this file
  const used = new Set(parsed.items.flatMap(it => it.places));
  $('placeOpts').innerHTML = PLACES.filter(p => used.has(p)).map(p => `<option value="${esc(p)}">`).join('');
  $('placePresets').innerHTML = PLACE_PRESETS.map((g, i) => `<button type="button" class="ghost" data-i="${i}">${esc(g.label)}</button>`).join('')
    + `<button type="button" class="ghost" data-i="-1">検索をクリア</button>`;
  $('placePresets').querySelectorAll('button').forEach(b => b.onclick = () => {
    $('placeQ').value = b.dataset.i < 0 ? '' : PLACE_PRESETS[b.dataset.i].places.join('、');
    render();
  });
  markPreset();
}
// Highlight the preset that matches what is in the search box
function markPreset() {
  const q = String($('placeQ').value || '').trim();
  $('placePresets').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.i >= 0 && PLACE_PRESETS[b.dataset.i].places.join('、') === q));
}
// Contains-search on the raw cell text (a cell can hold several places). Width/space differences are
// ignored so typing 肉処理 finds 昼間肉処理室 and also mis-typed cells. Several terms with 「、」 = any of them.
function placeOk(it, terms) {
  if (!parsed.hasPlace || !terms.length) return true;
  const hay = looseKey(it.placeRaw);
  return terms.some(t => hay.includes(t));
}
const selectedPlaces = () => String($('placeQ').value || '').split(/[、,，]+/).map(looseKey).filter(Boolean);

function renderPlaceAlert() {
  const issues = parsed.placeIssues, cf = parsed.conflicts, F = parsed.multi;
  let h = cf.length ? `<details class="alert" ${cf.length <= 10 ? 'open' : ''}><summary>⚠ 同じ品目・同じ日の計画が複数のファイルで違います（${cf.length}件）— 開始日が新しいシートの値を使っています</summary>
    <table><tr><th>日付</th><th>コード</th><th>品目名</th><th>使わなかった値</th><th>使った値</th></tr>
    ${cf.map(c => `<tr><td>${md(c.date)}</td><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.oldPlan)}<br><span class="note">${esc(c.oldFile)}</span></td><td><b>${esc(c.plan)}</b><br><span class="note">${esc(c.file)}</span></td></tr>`).join('')}
    </table></details>` : '';
  if (!issues.length) { $('placeAlert').innerHTML = h; return; }
  const L = esc(parsed.placeLabel);
  $('placeAlert').innerHTML = h + `<details class="alert" ${issues.length <= 10 ? 'open' : ''}><summary>⚠ ${L}が一覧と一致しません（${issues.length}品目）— Excelで修正してください</summary>
    <table><tr>${F ? '<th>ファイル</th>' : ''}<th>行</th><th>コード</th><th>品目名</th><th>入力</th><th>一致しない部分</th><th>もしかして</th></tr>
    ${issues.map(i => `<tr>${F ? `<td>${esc(i.file)}</td>` : ''}<td>${i.row}</td><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${esc(i.raw) || '（空欄）'}</td>
      <td>${i.bad.map(b => `<span class="bad">${esc(b.text)}</span>`).join('<br>')}</td>
      <td>${i.bad.map(b => b.sug ? `<span class="sug">${esc(b.sug)}</span>` : '—').join('<br>')}</td></tr>`).join('')}
    </table><p class="note">一覧と完全に一致する名前だけが有効です（全角/半角・スペース・①も区別）。複数の場合は「、」で区切ってください。（検索は「含む」なので、修正前でも表示されます）</p></details>`;
}

function selected() {
  const cats = new Set([...$('cats').querySelectorAll('input:checked')].map(i => i.value));
  const f = $('from').value, t = $('to').value, z = $('showZero').checked;
  const ps = selectedPlaces();
  return parsed.items.filter(it => cats.has(it.cat) && placeOk(it, ps) && it.date >= f && it.date <= t && (z || it.plan !== 0))
    .sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order); // same order as the Excel rows
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n === null ? '' : n.toLocaleString('ja-JP');

function render() {
  if (!parsed) return;
  if (TABS_OFF.includes(view)) view = 'day';
  markPreset();
  renderStatusAlert();
  const items = selected();
  const live = items.filter(i => i.plan !== 0);
  const days = parsed.dates.filter(d => d.key >= $('from').value && d.key <= $('to').value);
  let html = `<div class="stats"><div><b>${live.length}</b>製造予定</div><div><b>${new Set(live.map(i => i.date)).size}</b>製造日</div><div><b>${new Set(live.map(i => i.name)).size}</b>品目</div><div><b>${items.length - live.length}</b>0（中止・変更）</div></div>
  <div class="tabs noprint">${TABS.filter(([v]) => !TABS_OFF.includes(v)).map(([v, label]) => `<button data-v="${v}" class="${view === v ? 'on' : ''}">${label}</button>`).join('')}</div>`;

  if (view === 'day') {
    html += `<div class="panel noprint"><div class="row">
      <button id="dayPrint">印刷</button>
      <button class="ghost" id="dayCsv">CSVダウンロード</button></div>
      <p class="note" style="margin:10px 0 0">印刷は6日ずつのカレンダー（A4横）。各日の下に追加・変更を書き込む欄があります。</p></div>`;
    for (const d of days) {
      const list = items.filter(i => i.date === d.key);
      const wd = new Date(d.y, d.m - 1, d.d).getDay();
      html += `<div class="day ${wd === 0 || wd === 6 ? 'we' : ''}"><h2>${d.m}/${d.d}（${WD[wd]}）<span>${list.filter(i => i.plan !== 0).length}件</span></h2>`;
      if (!list.length) { html += `<div class="empty">予定なし</div></div>`; continue; }
      html += `<table><tr><th class="cat">分類</th><th class="code">コード</th><th>品目名</th>${parsed.hasPlace ? `<th class="cat">${esc(parsed.placeLabel)}</th>` : ''}<th class="num">計画</th><th class="num">数量</th><th>備考</th></tr>`;
      for (const i of list) html += `<tr class="${i.plan === 0 ? 'zero' : ''}"><td class="cat">${esc(i.cat)}</td><td class="code">${esc(i.code)}</td><td class="name">${esc(i.name)}</td>${parsed.hasPlace ? `<td class="place">${i.places.map(esc).join('、')}${i.placeBad ? `${i.places.length ? '、' : ''}<span class="bad">⚠${esc(i.placeRaw) || '空欄'}</span>` : ''}</td>` : ''}<td class="num">${fmt(i.plan)}${esc(i.planUnit)}</td><td class="num">${fmt(i.qty)} ${esc(i.unit)}</td><td class="note">${esc(i.note)}</td></tr>`;
      html += `</table></div>`;
    }
  } else if (view === 'inst') {
    html += renderInst();
  } else if (view === 'dept') {
    html += renderDept();
  } else if (view === 'em') {
    html += renderEm();
  } else {
    html += `<div class="panel noprint"><div class="row">
      <button id="mx10">10日間（明日から）</button>

      ${parsed.hasPlace ? `<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="mxSplit" ${mxSplit ? 'checked' : ''}>${esc(parsed.placeLabel)}ごとにページを分ける</label>` : ''}
      </div><p class="note" style="margin:10px 0 0">計画の数字を表示します。状態が「使用中」の品目は計画がなくても行を出します。印刷は空欄も大きめのマスなので、変更があれば○や数字を書き込めます。</p></div>`;
    const prods = mxProducts(items);
    html += `<div class="mx"><table><tr><th class="name">品目名</th><th>単位</th>${days.map((d, n) => { const wd = new Date(d.y, d.m - 1, d.d).getDay(); return `<th class="${wd === 0 || wd === 6 ? 'we' : ''} ${n % 2 ? 'alt' : ''}">${d.m}/${d.d}<br>${WD[wd]}</th>`; }).join('')}</tr>`;
    for (const p of prods) {
      const mine = items.filter(i => i.order === p.order);
      html += `<tr><td class="name">${esc(p.name)}</td><td>${esc(p.planUnit)}</td>${days.map((d, n) => { const it = mine.find(i => i.date === d.key), a = n % 2 ? 'alt' : ''; return it ? `<td class="${a} ${it.plan === 0 ? 'z' : ''}" title="${esc(it.note)}">${fmt(it.plan)}</td>` : `<td class="${a}"></td>`; }).join('')}</tr>`;
    }
    html += `</table></div>`;
  }
  $('out').innerHTML = html;
  $('out').querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  if (view === 'inst') {
    $('instDate').onchange = e => { instDate = e.target.value; render(); };
    $('instCopy').onclick = copyInst;
    $('instCsv').onclick = downloadInstCsv;
    $('instPrint').onclick = () => window.print();
    renderInstPrint();
  } else if (view === 'em' && !$('em10')) {
    $('printview').innerHTML = ''; // no 早朝 plans in this file: only the message is shown, nothing to print
  } else if (view === 'em') {
    $('em10').onclick = setTenDays;
    $('emPaper').onchange = e => { emPaper = e.target.value; renderEmPrint(); };
    if ($('emPrevClear')) $('emPrevClear').onclick = () => { emPrev = null; emPrevOff = true; render(); };
    if ($('emPrintChg')) $('emPrintChg').onclick = () => { emPrint = 'chg'; renderEmPrint(); window.print(); emPrint = 'grid'; renderEmPrint(); };
    $('out').querySelectorAll('.seg button').forEach(b => b.onclick = () => { emLayout = b.dataset.l; render(); });
    $('emDate').onchange = e => { emDate = e.target.value; render(); };
    $('emCopy').onclick = () => copyRows(emDayRows(true), $('emMsg'), $('emFallback'));
    $('emXlsx').onclick = exportEmXlsx;
    $('emPrintGrid').onclick = () => { emPrint = 'grid'; renderEmPrint(); window.print(); };
    $('emPrintDay').onclick = () => { emPrint = 'day'; renderEmPrint(); window.print(); };
    renderEmPrint();
  } else if (view === 'mx') {
    $('mx10').onclick = setTenDays;
    $('mxPrint').onclick = () => window.print();
    $('mxXlsx').onclick = () => exportMxXlsx(items);
    $('mxCsv').onclick = () => downloadRowsCsv(mxPlainRows(items), `計画表_${$('from').value}_${$('to').value}.csv`);
    if ($('mxSplit')) $('mxSplit').onchange = e => { mxSplit = e.target.checked; render(); };
    renderMxPrint(items);
  } else if (view === 'dept') {
    $('deptPrint').onclick = () => window.print();
    renderDeptPrint();
  } else {
    $('dayPrint').onclick = () => window.print();
    $('dayCsv').onclick = downloadCSV;
    renderPrint(items);
  }
}

// ---- 品目×日付 print: product rows × date columns of 計画, big cells to write changes in ----
let mxSplit = false;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function setTenDays() { // tomorrow + 10 days
  const t = new Date(); t.setDate(t.getDate() + 1);
  const e = new Date(t); e.setDate(e.getDate() + 9);
  $('from').value = ymd(t); $('to').value = ymd(e); render();
}

// ---- 早朝肉処理指示: daily slots. 枠 comes from the 肉処理 製造枠 column, else from 分類. Each day must fit one of EM_PATTERNS. ----
// 肉処理 製造枠 values (blank/0 = not 肉処理). Only メイン/サブ count toward EM_PATTERNS; the rest are their own columns.
const EM_FRAME = { 'メイン冷凍': 'メイン', 'サブ冷凍': 'サブ', '餃子': '餃子', 'キット': 'キット', '米飯課・宅配': '米飯課・宅配', '米飯課/宅配': '米飯課・宅配',
  '米飯課': '米飯課・宅配', '宅配': '米飯課・宅配', '販促': '販促', 'その他': 'その他' };
const EM_SLOTS = { '冷凍品': 'メイン', '冷凍(箱)': 'サブ', '販売用餃子/通販': '餃子' }; // fallback by 分類, keys compared with norm()
const EM_PATTERNS = [{ name: '通常', main: 1, sub: 1 }, { name: 'メイン2本', main: 2, sub: 0 }];
const EM_FREE = ['餃子', 'キット', '米飯課・宅配', '販促', 'その他'];
// Columns of the 計画表, same order and header colours as サンプル_早朝肉処理計画表_2026-10_現場回答反映.xlsx
const EM_COLS = [['s1', 'メイン冷凍', '#2F5D8A', 22], ['s2', 'メイン②/サブ冷凍', '#4F7FAF', 15], ['餃子', '餃子', '#B5651D', 13], ['キット', 'キット', '#3C8C5A', 13],
  ['米飯課・宅配', '米飯課・宅配', '#7A5C9E', 11], ['販促', '販促', '#C0392B', 14], ['その他', 'その他', '#666666', 12]];
let emDate = null, emPrint = 'grid', emLayout = 'sheet';
// Anything named 餃子 is the 餃子 slot whatever its 分類 (e.g. ちくやの浜松餃子 is filed under 冷凍(箱))
const EM_GYOZA_NAME = /餃子/;
const emSlotOf = it => {
  if (it.hasSlot) return EM_FRAME[it.slot] || null; // per file: one may have the 製造枠 column and another not
  const k = Object.keys(EM_SLOTS).find(c => norm(c) === norm(it.cat));
  if (!k) return null;
  return EM_GYOZA_NAME.test(it.name) ? '餃子' : EM_SLOTS[k];
};

function emDay(key) {
  const all = parsed.items.filter(it => it.date === key && emSlotOf(it)).sort((a, b) => a.order - b.order);
  const live = all.filter(it => it.plan !== 0);
  const main = live.filter(it => emSlotOf(it) === 'メイン'), sub = live.filter(it => emSlotOf(it) === 'サブ');
  const free = Object.fromEntries(EM_FREE.map(s => [s, live.filter(it => emSlotOf(it) === s)]));
  const pat = EM_PATTERNS.find(p => main.length <= p.main && sub.length <= p.sub);
  // Slot 1 = first main. Slot 2 = second main, else the sub. Anything beyond that is over capacity.
  const slot1 = main.slice(0, 1), slot2 = main.length >= 2 ? main.slice(1, 2) : sub.slice(0, 1);
  const over = main.length >= 2 ? [...main.slice(2), ...sub] : [...main.slice(1), ...sub.slice(1)];
  let status, ng = false;
  if (!pat) { ng = true; status = `⚠ 超過（メイン${main.length}・サブ${sub.length}）`; }
  else if (main.length === 2) status = 'メイン2本';
  else if (!main.length && !sub.length) status = live.length ? '冷凍なし' : '予定なし';
  else status = main.length && sub.length ? '通常' : '空き枠あり';
  return { key, all, live, main, sub, free, slot1, slot2, over, zero: all.filter(it => it.plan === 0), status, ng };
}
const emDays = () => parsed.dates.filter(d => d.key >= $('from').value && d.key <= $('to').value).map(d => emDay(d.key));
const emQty = it => `${fmt(it.plan)}${esc(it.planUnit)}${it.qty !== null && it.unit !== it.planUnit ? ` <span class="tag">(${fmt(it.qty)}${esc(it.unit)})</span>` : ''}`;
// ---- Changes since the last export from this browser: 追加 / キャンセル / 変更 (rules in EM_RULES).
// Same date + item = same plan; a plan moved to another day is キャンセル on the old day and 追加 on the new one.
let emPrev = null; // { version, exportedAt, from, to, byDate: Map(date → [{key, col, name, plan, planUnit}]) }
const emKey = (date, it) => `${date}|${it.code || it.name}`;
const emPlanText = p => `${fmt(p.plan)}${p.planUnit}`;
const emColOf = it => ({ 'メイン': 's1', 'サブ': 's2' })[emSlotOf(it)] || emSlotOf(it);
const emCompared = date => emPrev && date >= emPrev.from && date <= emPrev.to;
function emChangeOf(date, it) {
  if (!emCompared(date)) return null;
  const p = (emPrev.byDate.get(date) || []).find(p => p.key === emKey(date, it));
  if (!p) return { type: '追加' };
  return p.plan !== it.plan || p.planUnit !== it.planUnit ? { type: '変更', before: emPlanText(p) } : null;
}

// Each cell as a list of lines, shared by the screen, the printout and the Excel export:
// { it, tag, over, change } planned item · { it, zero } 0 that was already 0 · { cancel } キャンセル
function emLines(day) {
  const cols = Object.fromEntries(EM_COLS.map(([k]) => [k, []]));
  const add = (k, it, extra) => cols[k].push({ it, change: emChangeOf(day.key, it), ...extra });
  day.slot1.forEach(it => add('s1', it));
  day.slot2.forEach(it => add('s2', it, { tag: emSlotOf(it) === 'メイン' ? 'メイン②' : '' }));
  day.over.forEach(it => add('s2', it, { over: true }));
  EM_FREE.forEach(s => day.free[s].forEach(it => add(s, it)));
  const live = new Set(day.live.map(it => emKey(day.key, it)));
  const cancelled = emCompared(day.key) ? (emPrev.byDate.get(day.key) || []).filter(p => !live.has(p.key)) : [];
  const gone = new Set(cancelled.map(p => p.key));
  day.zero.forEach(it => { if (!gone.has(emKey(day.key, it))) cols[emColOf(it)].push({ it, zero: true }); });
  cancelled.forEach(p => (cols[p.col] || cols.s1).push({ cancel: p }));
  return cols;
}
const emChgTag = c => c.type === '変更' ? `<span class="chg">変更 ${esc(c.before)}→</span> ` : `<span class="chg">${c.type}</span> `;
function emLineHtml(l) {
  if (l.cancel) return `<div class="cx"><span class="chg">キャンセル</span> <s>${esc(l.cancel.name)} ${esc(emPlanText(l.cancel))}</s></div>`;
  if (l.zero) return `<div class="zz">${esc(l.it.name)} 0</div>`;
  const it = l.it, chg = l.change ? emChgTag(l.change) : '';
  if (l.over) return `<div class="over">${chg}⚠超過 ${esc(it.name)} ${emQty(it)}</div>`;
  return `<div>${chg}${l.tag ? `<span class="tag">${l.tag}</span> ` : ''}${esc(it.name)} <b>${emQty(it)}</b>${it.note ? ` <span class="tag">${esc(it.note)}</span>` : ''}</div>`;
}
const emHasChange = lines => lines.some(l => l.change || l.cancel);
function emCells(day) {
  const cols = emLines(day);
  return Object.fromEntries(EM_COLS.map(([k]) => [k, cols[k].map(emLineHtml).join('')]));
}
// Flat list for the 変更一覧 / 変更連絡
function emChanges(days) {
  const out = [];
  for (const d of days) {
    const cols = emLines(d);
    for (const [k, label] of EM_COLS) for (const l of cols[k]) {
      if (l.cancel) out.push({ date: d.key, type: 'キャンセル', col: label, name: l.cancel.name, before: emPlanText(l.cancel), after: '' });
      else if (l.change) out.push({ date: d.key, type: l.change.type, col: label, name: l.it.name, before: l.change.before || '', after: emPlanText(l.it) });
    }
  }
  return out;
}

// How to enter 変更 / キャンセル / 追加 in the 在庫表 (the rows and column this tool reads); the comparison follows the same rules
const EM_RULES = `<details class="rules" open><summary>変更・キャンセル・追加のルール（在庫表への入れ方）</summary>
  <p>在庫表の品目ごとの<b>「計画（倍）」の行</b>と<b>「備考」の行</b>に、その<b>日付の列</b>で入れます。<b>同じ日・同じ品目</b>どうしで比べます。</p>
  <table><tr><th>区分</th><th>どういうとき</th><th>「計画（倍）」の行</th><th>「備考」の行</th></tr>
  <tr><td><span class="chg">変更</span></td><td>同じ日の同じ品目で、<b>数量（倍数）が変わった</b></td><td>新しい倍数に<b>書き換える</b></td><td><b>変更</b></td></tr>
  <tr><td><span class="chg">キャンセル</span></td><td>その日の予定が<b>なくなった</b></td><td><b>0</b> を入れる（<b>消さない</b>）</td><td><b>キャン</b></td></tr>
  <tr><td><span class="chg">追加</span></td><td>その日に<b>なかった予定が入った</b></td><td>倍数を入れる</td><td><b>追加</b></td></tr></table>
  <p style="margin:10px 0 4px">例：肉だんご（1kg）</p>
  <table class="zk"><tr><th>品目名</th><th>行種別</th><th>11/2</th><th>11/4</th><th>11/5</th></tr>
  <tr><td rowspan="2">肉だんご（1kg）</td><td>備考</td><td>変更</td><td>キャン</td><td>追加</td></tr>
  <tr><td>計画（倍）</td><td>4 <small>（3から）</small></td><td>0</td><td>3</td></tr></table>
  <ul><li><b>日をずらすとき</b>は「変更」にしない：元の日＝<b>0＋キャン</b>、新しい日＝<b>倍数＋追加</b>。</li>
  <li><b>空欄と0は違う</b>：空欄＝もともと予定なし（計画表に出ない）、0＝キャンセル（取り消し線で出る）。</li>
  <li><b>在庫表にない品目を足すとき</b>：品目の行を作り、<b>「肉処理 製造枠」の列</b>に メイン冷凍／サブ冷凍／餃子／キット／米飯課・宅配／販促／その他 のどれかを入れる（空欄・0だと計画表に出ません）。</li>
  <li>印刷用のExcelを手で直すときも同じ区分で：<b>【変更 3倍→】</b>・<b>【キャンセル】</b>＋取り消し線・<b>【追加】</b>、直したセルは<b>黄色</b>。</li></ul></details>`;

// The plan of the last export is remembered in this browser and compared against automatically
const EM_LAST_KEY = 'lotSchedule.emLastExport';
let emPrevOff = false; // 比較をやめる: don't auto-load the remembered export again until the next export
function emRememberExport(data) {
  try { localStorage.setItem(EM_LAST_KEY, JSON.stringify(data)); } catch {}
}
function emLastExport() {
  try { const rows = JSON.parse(localStorage.getItem(EM_LAST_KEY)); return rows ? emPrevFromRows(rows) : null; } catch { return null; }
}

function emPrevFromRows(data) {
  const prev = { byDate: new Map() };
  for (const r of data) {
    if (r[0] === 'meta') Object.assign(prev, { version: Number(r[1]) || 1, exportedAt: String(r[2]), from: String(r[3]), to: String(r[4]) });
    else if (r[0] === 'item') {
      const [, date, col, code, name, plan, planUnit] = r, key = `${date}|${code || name}`;
      if (!prev.byDate.has(date)) prev.byDate.set(date, []);
      prev.byDate.get(date).push({ key, col, name: String(name), plan: Number(plan), planUnit: String(planUnit) });
    }
  }
  return prev;
}
// 枠×日付 view: メイン・2枠目・餃子 always, other columns only when the period has any
const emRows = days => EM_COLS.filter(([k]) => ['s1', 's2', '餃子'].includes(k) || days.some(d => d.all.some(it => emSlotOf(it) === k)));

// Printable area (paper minus 7mm margins) for the one-sheet 計画表
const EM_PAPER = { A4: { w: 196, h: 283 }, A3: { w: 283, h: 406 } };
let emPaper = 'A4';

// 日付×枠 sheet (the Excel layout): one row per date, every column shown so the crew can write in
// Column widths follow the longest entry, so empty write-in columns don't squeeze the planned items into tiny text
function emColWidths(days) {
  const cells = days.map(emCells);
  const len = html => Math.max(0, ...html.split('</div>').map(s => s.replace(/<[^>]+>/g, '').length));
  const w = EM_COLS.map(([k]) => { const m = Math.max(...cells.map(c => len(c[k]))); return m ? Math.min(Math.max(m, 12), 34) / 2 : 7; });
  const tot = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / tot * 100);
}
function emSheet(days, rowH) {
  const lines = days.map(emLines), pct = rowH ? emColWidths(days) : EM_COLS.map(c => c[3]);
  const cells = lines.map(c => Object.fromEntries(EM_COLS.map(([k]) => [k, c[k].map(emLineHtml).join('')])));
  return `<table class="ev evx"><colgroup><col style="width:calc(var(--fs,16px) * 3.8)"><col style="width:calc(var(--fs,16px) * 1.9)">${pct.map(p => `<col style="width:${p.toFixed(1)}%">`).join('')}</colgroup>
    <thead><tr><th>日付</th><th>曜日</th>${EM_COLS.map(c => `<th style="background:${c[2]}">${c[1]}</th>`).join('')}</tr></thead><tbody>
    ${days.map((d, i) => { const [y, m, dd] = d.key.split('-').map(Number), w = new Date(y, m - 1, dd).getDay(), wc = w === 0 ? 'sun' : w === 6 ? 'sat' : '';
      return `<tr ${rowH ? `data-h="${rowH}"` : ''} class="${i % 2 ? 'alt' : ''} ${d.ng ? 'ng' : ''}"><td class="dt ${wc}">${m}/${dd}</td><td class="dt ${wc}">${WD[w]}</td>${EM_COLS.map(c => `<td class="${emHasChange(lines[i][c[0]]) ? 'hl' : ''}">${cells[i][c[0]]}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table>`;
}

function emDayRows(withHeader) {
  const day = emDay(emDate);
  const [y, m, d] = emDate.split('-').map(Number), wd = WD[new Date(y, m - 1, d).getDay()];
  const label = it => it === day.slot1[0] ? 'メイン冷凍' : day.slot2.includes(it) ? (emSlotOf(it) === 'メイン' ? 'メイン冷凍②' : 'サブ冷凍') : EM_FREE.includes(emSlotOf(it)) ? emSlotOf(it) : '⚠超過';
  const rows = [...day.slot1, ...day.slot2, ...day.over, ...EM_FREE.flatMap(s => day.free[s])].map(it =>
    [`${y}/${m}/${d}`, wd, label(it), it.code, it.name, it.plan, it.planUnit, it.qty ?? '', it.unit, '', it.note]);
  return withHeader ? [['日付', '曜日', '枠', 'コード', '品目名', '計画', '計画単位', '数量', '単位', '出来高', '備考'], ...rows] : rows;
}

function renderEm() {
  const first = parsed.dates[0].key, last = parsed.dates[parsed.dates.length - 1].key;
  if (!emDate) { const t = new Date(); t.setDate(t.getDate() + 1); emDate = ymd(t); }
  emDate = emDate < first ? first : emDate > last ? last : emDate;
  if (!emPrev && !emPrevOff) emPrev = emLastExport();
  const days = emDays();
  if (!parsed.items.some(emSlotOf)) return `<div class="empty">${parsed.hasSlot ? '「肉処理 製造枠」が入った品目の計画がありません。' : 'このシートには 冷凍品・冷凍(箱)・販売用餃子/通販 の計画がありません（早朝の在庫表を入れてください）。'}</div>`;
  const ng = days.filter(d => d.ng);
  let h = ng.length ? `<details class="alert" open><summary>⚠ 枠オーバーの日があります（${ng.length}日）</summary><table><tr><th>日付</th><th>メイン</th><th>サブ</th><th>内容</th></tr>${ng.map(d =>
    `<tr><td>${md(d.key)}</td><td>${d.main.length}</td><td>${d.sub.length}</td><td>${[...d.main, ...d.sub].map(it => esc(it.name)).join('、')}</td></tr>`).join('')}</table>
    <p class="note">1日に「メイン1＋サブ1」または「メイン2・サブなし」まで。</p></details>` : '';
  h += `<div class="panel noprint"><div class="row">
    <button id="em10">10日間（明日から）</button>
    <span class="seg"><button class="${emLayout === 'sheet' ? 'on' : ''}" data-l="sheet">日付×枠（印刷イメージ）</button><button class="${emLayout === 'grid' ? 'on' : ''}" data-l="grid">枠×日付</button></span>
    <button class="ghost" id="emPrintGrid">計画表を印刷</button>
    <label class="f">用紙<select id="emPaper">${Object.keys(EM_PAPER).map(p => `<option ${p === emPaper ? 'selected' : ''}>${p}</option>`).join('')}</select></label>

// Printed on B4 縦 (JIS). Long periods are split into pages of at most MX_DAYS_PER_PAGE days so the
// date columns stay wide enough to write in.
const MX_DAYS_PER_PAGE = 11; // ~10 days per B4 sheet, like the floor sample, so Excel prints at 100% (no shrink-to-fit) and the fonts stay at their set size
// The 品目×日付 sheet as pages { title, sub, days, prods, items, place }. The print and the Excel export both use this,
// so they split the same way (one Excel sheet per printed page).
function mxPages(items, title, sub, place) {
  const all = parsed.dates.filter(d => d.key >= $('from').value && d.key <= $('to').value);
  const pages = Math.max(1, Math.ceil(all.length / MX_DAYS_PER_PAGE)), per = Math.ceil(all.length / pages) || 1;
  // Every page lists the same products (planned in the period, plus every 使用中 one), so rows line up and there is room to write in
  const prods = mxProducts(items, place), out = [];
  for (let p = 0; p < pages; p++) {
    const days = all.slice(p * per, (p + 1) * per);
    if (days.length) out.push({ title, sub: pages > 1 ? `${p + 1}/${pages}枚目　｜　${sub}` : sub, days, prods, place,
      items: items.filter(i => i.date >= days[0].key && i.date <= days[days.length - 1].key) });
  }
  return out.length ? out : [{ title, sub, days: all, prods, place, items: [] }];
}
// Pages for the current settings: one set, or one set per 作業場所 when 作業場所ごとにページを分ける is on

  return mxPages(items, q ? `計画表　${q}` : '計画表', `${cats}　｜　${file}`);
}
const mxRange = pg => [pg.days.length ? pg.days[0].key : $('from').value, pg.days.length ? pg.days[pg.days.length - 1].key : $('to').value];

// 品目×日付 rows: products planned in the period, plus every 使用中 product that passes the 分類 / 作業場所 filters,
// even with no plan (blank row to write in). `place` limits the list to one 作業場所 page.
const ACTIVE = '使用中', INACTIVE = ['未使用', '保存中']; // a plan on an INACTIVE product raises the alert
function mxProducts(items, place) {
  const cats = new Set([...$('cats').querySelectorAll('input:checked')].map(i => i.value)), ps = selectedPlaces();

// ---- Calendar print (日別 and 作業場所別): CAL_DAYS consecutive days per A4 横 sheet, one column per day,
// large text, and a ruled write-in area at the bottom of every day for additions and changes.
const CAL_DAYS = 6, CAL_MAX_PT = 20;
const calItemHtml = (it, place) => {
  // `place` (作業場所別) marks the other places sharing the item; on the 未確認 page, what was typed
  const oth = place && place !== DEPT_UNKNOWN ? others(it, place) : place === DEPT_UNKNOWN ? (it.placeRaw || '空欄') : '';
  // Name on its own line (columns are narrow); below it that day's 備考 on the left and the lot (計画 and 計画×ロット) on the right
  return `<div class="it ${it.plan === 0 ? 'z' : ''}"><div class="nm">${esc(it.name)}${oth ? ` <span class="oth">[${esc(oth)}]</span>` : ''}</div>
    <div class="ln"><span class="nt">${it.note ? `※${esc(it.note)}` : ''}</span><span class="q">${fmt(it.plan)}${esc(it.planUnit)}${it.qty !== null && it.unit !== it.planUnit ? ` <small>(${fmt(it.qty)}${esc(it.unit)})</small>` : ''}</span></div></div>`;
};
// One sheet: `lists` is [{ key, items }] for up to CAL_DAYS days
function calendarPage(lists, title, sub, place) {
  const md2 = k => { const [, m, d] = k.split('-').map(Number); return `${m}/${d}`; };
  const head = lists.map(({ key }) => { const [y, m, d] = key.split('-').map(Number), w = new Date(y, m - 1, d).getDay();
    return `<th class="${w === 0 ? 'sun we' : w === 6 ? 'sat we' : ''}">${m}/${d}（${WD[w]}）</th>`; }).join('');
  const body = lists.map(({ key, items }) => { const [y, m, d] = key.split('-').map(Number), w = new Date(y, m - 1, d).getDay();
    return `<td class="${w === 0 || w === 6 ? 'we' : ''}"><div class="col">${items.map(it => calItemHtml(it, place)).join('')}<div class="wa"><span>追加・変更</span></div></div></td>`; }).join('');
  return `<div class="calpage d5page"><h1>${esc(title)}　${md2(lists[0].key)}〜${md2(lists[lists.length - 1].key)}<span>${esc(sub)}</span></h1>
    <table class="d5"><colgroup>${lists.map(() => `<col style="width:${(100 / lists.length).toFixed(2)}%">`).join('')}</colgroup>
    <thead><tr>${head}</tr></thead><tbody><tr>${body}</tr></tbody></table>
    <p class="foot">変更・追加は各日の下の欄に書き込んでください。印刷日：${new Date().toLocaleDateString('ja-JP')}</p></div>`;
}
// One text size per sheet: each day's box finds the largest size (up to CAL_MAX_PT) at which its plans plus the write-in
// space fit the sheet's height, and the whole sheet uses the smallest of those (the busiest day's), so all days match.
// A busy day keeps 30mm to write in down to 7pt; below that the write-in space shrinks (15mm, then 8mm) so the text can
// stay ≥ 5pt. All boxes are then stretched to the bottom of the sheet.
const CAL_FIT_STEPS = [[30, 7], [15, 6], [8, 5]]; // [write-in mm, smallest pt]
function fitDayPage(page) {
  const mm = 96 / 25.4, cols = [...page.querySelectorAll('.col')];
  cols.forEach(c => { c.style.height = ''; c.style.setProperty('--fs', '5pt'); c.style.setProperty('--wa', '8mm'); });
  // Title, date header and footer: everything on the sheet except the tallest box
  const avail = (PAGE_H_MM - 2) * mm - (page.scrollHeight - Math.max(...cols.map(c => c.offsetHeight)));
  // Fits = not taller than the sheet allows and nothing (e.g. a long 計画 like 100倍 (100p)) wider than the box
  const fits = (c, pt, wa) => { c.style.setProperty('--fs', pt + 'pt'); c.style.setProperty('--wa', wa + 'mm'); return c.offsetHeight <= avail && c.scrollWidth <= c.clientWidth + 1; };
  const best = c => { // largest size this day alone could use
    for (const [wa, minPt] of CAL_FIT_STEPS) {
      if (!fits(c, minPt, wa)) continue;
      let lo = fits(c, CAL_MAX_PT, wa) ? CAL_MAX_PT : minPt, hi = CAL_MAX_PT; // binary search to 0.25pt
      while (hi - lo > 0.25) { const mid = (lo + hi) / 2; if (fits(c, mid, wa)) lo = mid; else hi = mid; }
      return Math.floor(lo * 4) / 4;
    }
    return 5; // still too many: smallest size, it may run over the sheet
  };
  const pt = Math.min(...cols.map(best));
  page.style.setProperty('--sheet-pt', pt); // (for checking)
  // Every day at that size, each with as much write-in space as still fits
  for (const c of cols) if (!CAL_FIT_STEPS.some(([wa]) => fits(c, pt, wa))) fits(c, pt, 8);
  cols.forEach(c => c.style.height = avail + 'px');
  return page.scrollHeight <= (PAGE_H_MM - 2) * mm + 1;
}
// The calendar for f..t, appended to #printview: every calendar day in the range, CAL_DAYS per sheet (11 days → 6 + 5).
// Each date appears on exactly one sheet.
function appendCalendar(items, f, t, title, sub, place) {
  const keys = [];
  for (const d = toDate(f); ymd(d) <= t; d.setDate(d.getDate() + 1)) keys.push(ymd(d));
  const box = document.createElement('div');
  $('printview').appendChild(box);
  for (let i = 0; i < keys.length; i += CAL_DAYS) {
    const tmp = document.createElement('div');
    tmp.innerHTML = calendarPage(keys.slice(i, i + CAL_DAYS).map(key => ({ key, items: items.filter(it => it.date === key) })), title, sub, place);
    const page = tmp.firstElementChild;
    box.appendChild(page);
    fitDayPage(page);
  }
}

function renderPrint(items) {

// 早朝 計画表: step the font size down until the page fits the chosen paper; false if not even at minFs
const PAGE_H_MM = 210 - 14;
function fitPage(page, minFs = 5) {
  const em = page.classList.contains('empage'), H = em ? EM_PAPER[emPaper].h : PAGE_H_MM;
  const trs = [...page.querySelectorAll('tr[data-h]')];
  // Prefer equal-height weeks; if that doesn't fit, let busy weeks grow (min 12mm) so the text can stay larger
  for (let fs = em ? 24 : 10.5; fs >= minFs; fs -= 0.5) {
    page.style.setProperty('--fs', fs + 'px');
    for (const even of [true, false]) {
      trs.forEach(tr => tr.style.height = even ? tr.dataset.h + 'mm' : (em ? '6mm' : '12mm'));
      if (page.scrollHeight / (96 / 25.4) <= H - 2) return true;
    }
  }
  return false;
}
function fitPrint() {
  for (const page of $('printview').querySelectorAll('.empage')) fitPage(page);
}

// Clipboard calls can hang (permission prompt, unfocused page) — give up after 1.5s and try the next method
const within = (p, ms = 1500) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

// Copy rows to the clipboard for pasting into Google Sheets; falls back to a selected textarea if blocked
async function copyRows(rows, msg, box) {
  const clean = v => String(v ?? '').replace(/[\t\r\n]+/g, ' ');
  const tsv = rows.map(r => r.map(clean).join('\t')).join('\n');
  // An HTML table pastes into Google Sheets as proper cells too
  const html = '<table>' + rows.map(r => '<tr>' + r.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('') + '</table>';
  box.hidden = true;
  let ok = false;
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await within(navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([tsv], { type: 'text/plain' }), 'text/html': new Blob([html], { type: 'text/html' }) })]));
      ok = true;
    }
  } catch (e) { }
  if (!ok) try { await within(navigator.clipboard.writeText(tsv)); ok = true; } catch (e) { }
  if (!ok) try {
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    ok = document.execCommand('copy');
    ta.remove();
  } catch (e) { }
  if (ok) { msg.textContent = `✓ ${rows.length - 1}行コピーしました。Googleシートで A1 を選んで ⌘V`; return; }
  // The browser blocked clipboard access (e.g. VS Code preview): show the data selected for a manual ⌘C
  box.hidden = false; box.value = tsv; box.focus(); box.select();
  msg.textContent = 'ブラウザがコピーをブロックしました。下の枠が選択された状態なので ⌘C を押してください。';
}

      // paperSize 12 = B4 (JIS 257×364mm); one page wide, as many pages tall as the product list needs, header row repeated
      pageSetup: { paperSize: 12, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true,
        margins: { left: 0.25, right: 0.25, top: 0.3, bottom: 0.3, header: 0.1, footer: 0.1 }, printTitlesRow: '2:2' }
    });
    ws.columns = [NAME_W, 6, ...days.map(() => DAY_W)].map(width => ({ width }));

    // Row 1: title on the left, file / 分類 on the right (as in the print header)
    const mid = Math.max(2, Math.ceil(last / 2));
    ws.mergeCells(1, 1, 1, mid); ws.mergeCells(1, mid + 1, 1, last);
    Object.assign(ws.getCell(1, 1), { value: `${pg.title}　${md(f)}〜${md(t)}`, font: { bold: true, size: 16 }, alignment: { vertical: 'middle' } });
    Object.assign(ws.getCell(1, mid + 1), { value: pg.sub, font: { size: 9 }, alignment: { horizontal: 'right', vertical: 'middle', wrapText: true } });
    ws.getRow(1).height = 30;

    // Row 2: header. Weekend columns darker, every other date tinted, 日 red / 土 blue
    const head = ws.getRow(2);
    head.values = ['品目名', '単位', ...days.map(d => `${d.m}/${d.d}\n${WD[wdOf(d)]}`)];
    head.height = 30;
    for (let c = 1; c <= last; c++) {
      const cell = head.getCell(c), n = c - 3, d = days[n], w = d ? wdOf(d) : -1, we = w === 0 || w === 6, alt = d && n % 2;
      cell.fill = fill(alt && we ? '#C8D6E6' : alt ? '#E3EDF8' : we ? '#D9D9D9' : '#EEEEEE');
      cell.font = { bold: true, size: 10, color: { argb: w === 0 ? 'FFBB0000' : w === 6 ? 'FF0033AA' : 'FF000000' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = border;
    }

    // Product rows: bold 品目名 only, 計画 large and bold, that day's 備考 small under it, 0 struck through
    prods.forEach((p, r) => {
      const row = ws.getRow(3 + r), mine = items.filter(i => i.order === p.order);
      row.getCell(1).value = p.name;
      row.getCell(1).font = { bold: true, size: 12 };
      row.getCell(1).alignment = { vertical: 'middle', wrapText: true };
      row.getCell(2).value = p.planUnit;
      row.getCell(2).font = { size: 9 };
      let noteLines = 0;
      days.forEach((d, n) => {
        const it = mine.find(i => i.date === d.key), cell = row.getCell(3 + n);
        if (!it) { cell.font = { bold: true, size: 13 }; return; } // anything typed in later is as large as the plans
        const pf = { bold: true, size: 13, ...(it.plan === 0 ? { strike: true, color: { argb: 'FF777777' } } : {}) };
        if (it.note) {
          cell.value = { richText: [{ text: fmt(it.plan), font: pf }, { text: '\n' + it.note, font: { size: 7, color: { argb: 'FF444444' } } }] };
          noteLines = Math.max(noteLines, Math.ceil(textW(it.note) * 0.65 / (DAY_W - 1)));
        } else { cell.value = it.plan; cell.font = pf; } // a plain number stays editable as a number
      });
      for (let c = 1; c <= last; c++) {
        const cell = row.getCell(c), n = c - 3, d = days[n], w = d ? wdOf(d) : -1, we = w === 0 || w === 6, alt = d && n % 2;
        if (d && (we || alt)) cell.fill = fill(alt && we ? '#D3DFEC' : alt ? '#E3EDF8' : '#F3F3F3');
        if (c > 1) cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.border = border;
      }
      // At least 11mm like the print (room to write in); taller for long names or long 備考
      const nameLines = Math.ceil(textW(p.name) * 1.2 / (NAME_W - 1)); // 12pt bold
      row.height = Math.max(31, nameLines * 15 + 4, 20 + noteLines * 10);
    });
    if (!prods.length) {
      ws.mergeCells(3, 1, 3, last);
      Object.assign(ws.getCell(3, 1), { value: '予定なし', alignment: { horizontal: 'center' } });
    }
    const foot = ws.getCell(3 + Math.max(prods.length, 1), 1);
    foot.value = `変更があれば数字を○で囲むか、新しい数字を書き込んでください。出力日：${out}`;
    foot.font = { size: 9 };
    // Every cell and every rich-text run in ＭＳ Ｐゴシック, the font the floor's copy uses
    ws.eachRow({ includeEmpty: true }, row => row.eachCell({ includeEmpty: true }, cell => {
      if (cell.value && cell.value.richText) cell.value = { richText: cell.value.richText.map(r => ({ ...r, font: { ...r.font, name: MX_FONT } })) };
      cell.font = { ...cell.font, name: MX_FONT };
    }));
  }
  const blob = new Blob([await book.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadCSV() {
  const items = selected();
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['日付', '曜日', '分類', 'コード', '品目名', parsed.placeLabel, '計画', '計画単位', '数量', '単位', '備考'].join(',')];
  for (const i of items) lines.push([i.date, WD[new Date(i.y, i.m - 1, i.d).getDay()], i.cat, i.code, i.name, i.placeRaw, i.plan, i.planUnit, i.qty ?? '', i.unit, i.note].map(q).join(','));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ロット予定_${$('from').value}_${$('to').value}.csv`;
  a.click();
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { loadFiles(e.target.files); e.target.value = ''; }; // reset so the same file can be picked again
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => loadFiles(e.dataTransfer.files));
['from', 'to', 'showZero'].forEach(id => $(id).onchange = render);
$('cats').onchange = render;
$('placeQ').oninput = () => { markPreset(); render(); };
$('allc').onclick = () => { $('cats').querySelectorAll('input').forEach(i => i.checked = true); render(); };
$('defc').onclick = () => { $('cats').querySelectorAll('input').forEach(i => i.checked = DEFAULT_CATS.some(dc => norm(dc) === norm(i.value))); render(); };
